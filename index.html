<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パソストップ GO（CPUオールスター版）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0; padding: 14px; background: #0b1120; color: #f8fafc; text-align: center;
    }
    h1 { font-size: 20px; color: #38bdf8; margin: 0 0 10px 0; letter-spacing: 0.03em; }

    #map {
      display: block; width: 100%; height: 290px; min-height: 290px;
      background: #1e293b; border-radius: 14px; margin-bottom: 12px;
      border: 2px solid #38bdf8; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    .main-btn {
      background: linear-gradient(90deg, #0284c7, #2563eb); color: white; border: none;
      padding: 15px 22px; font-size: 16px; font-weight: bold; border-radius: 999px;
      cursor: pointer; width: 100%; max-width: 360px; box-shadow: 0 4px 16px rgba(37,99,235,0.45);
    }
    .main-btn:active { transform: scale(0.98); }

    .sub-btn {
      background: #334155; color: #f1f5f9; border: 1px solid #64748b;
      padding: 8px 13px; font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .approve-btn {
      background: #16a34a; color: white; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1;
    }
    .reject-btn {
      background: #475569; color: #f8fafc; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }

    #status { margin: 10px 0 4px; font-weight: bold; color: #fde047; min-height: 22px; font-size: 14px; }
    #gpsAccuracy { font-size: 12px; color: #94a3b8; margin-bottom: 12px; min-height: 16px; }

    .box {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 13px; max-width: 440px; margin: 0 auto 12px; text-align: left;
    }
    .box-title {
      font-size: 15px; font-weight: bold; color: #7dd3fc; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .ai-card {
      background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px;
      padding: 11px; margin-top: 8px; font-size: 13px; line-height: 1.5;
    }
    .ai-badge {
      display: inline-block; background: #0284c7; color: #fff; font-size: 11px;
      padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; font-weight: bold;
    }
    .ai-test-badge { background: #e11d48; }
    .ai-actions { display: flex; gap: 8px; margin-top: 10px; }
    .ai-input {
      width: 100%; padding: 9px 11px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 13px; margin-top: 6px;
    }

    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; font-size: 13px; }
    .check-item { background: #0f172a; padding: 7px 10px; border-radius: 8px; color: #64748b; }
    .check-done { color: #4ade80; font-weight: bold; border: 1px solid #22c55e; }
    .pc-complete {
      margin-top: 8px; padding: 9px; background: linear-gradient(90deg, #16a34a, #059669);
      color: white; font-weight: bold; text-align: center; border-radius: 8px; display: none;
    }

    .part-list { list-style: none; padding: 0; margin: 0; }
    .part-item {
      background: #0f172a; padding: 9px 12px; margin-bottom: 6px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    }
    .rare-ur { border-left: 4px solid #f43f5e; }
    .rare-r  { border-left: 4px solid #facc15; }
    .rare-c  { border-left: 4px solid #38bdf8; }

    .pasostop-icon {
      width: 26px; height: 26px;
      background: radial-gradient(circle, #e0f2fe 20%, #0ea5e9 65%, #1d4ed8 100%);
      border: 3px solid #ffffff; border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8, 0 0 22px #0284c7;
    }
  </style>
</head>
<body>

  <h1>🖥️ パソストップ GO（CPUオールスター）</h1>
  <div id="map"></div>

  <button class="main-btn" onclick="spinPasostop()">⚡ パソストップを回す（現在地チェック）</button>
  <div id="status">青いパソストップに近づいてパーツを集めよう！</div>
  <div id="gpsAccuracy">GPS精度：未測定</div>

  <!-- AIおすすめスポット提案＆承認ボックス -->
  <div class="box">
    <div class="box-title">
      <span>🤖 AIパソストップ提案・承認</span>
      <button class="sub-btn" onclick="proposeAiStop()">精度改善候補を探す</button>
    </div>
    <div style="font-size:12px; color:#94a3b8;">
      既存スポット間の中間・接続地点を判定して提案（「TEST」を含むと必ず承認！）
    </div>
    <input type="text" id="customCandidateName" class="ai-input" placeholder="例：TEST_桜山ルート / 桜山〜昭和区役所 中間地点">
    <div id="aiProposalArea"></div>
  </div>

  <!-- 自作PC進捗 -->
  <div class="box">
    <div class="box-title">
      <span>🛠️ 自作PC 必須6パーツ進捗</span>
      <span id="progressCount">0 / 6</span>
    </div>
    <div class="checklist" id="checklist"></div>
    <div class="pc-complete" id="pcComplete">🎉 必須パーツ全制覇！自作PC起動成功！！</div>
  </div>

  <!-- 所持パーツ -->
  <div class="box">
    <div class="box-title">
      <span>📦 ゲットしたPCパーツ箱</span>
      <span id="cpuDexCount" style="font-size:12px; color:#38bdf8;">CPU図鑑: 0 / 17</span>
    </div>
    <ul class="part-list" id="partList"></ul>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const defaultStops = [
      { id: "proud_sakurayama", name: "パソストップ：プラウド昭和桜山", lat: 35.1548, lng: 136.9304, radius: 45 },
      { id: "sakurayama_st", name: "パソストップ：桜山駅", lat: 35.1536, lng: 136.9316, radius: 50 },
      { id: "ncu_hospital", name: "パソストップ：名古屋市立大学病院", lat: 35.1514, lng: 136.9333, radius: 80 },
      { id: "showa_ward", name: "パソストップ：名古屋市昭和区役所周辺", lat: 35.1585, lng: 136.9295, radius: 55 },
      { id: "arahata_st", name: "パソストップ：荒畑駅", lat: 35.1533, lng: 136.9225, radius: 50 },
      { id: "gokiso_st", name: "パソストップ：御器所駅", lat: 35.1511, lng: 136.9154, radius: 50 }
    ];

    let stops = JSON.parse(localStorage.getItem("pasostop_custom_stops") || "null") || defaultStops;
    let pendingProposal = null;

    // 歴代＆現行の有名CPUオールスター＋その他PCパーツ
    const partsPool = [
      // --- CPU（コモン：入門・懐かし・エントリー） ---
      { name: "CPU：Intel Celeron（セロリン）", category: "cpu", rare: "C", badge: "コモン", weight: 10 },
      { name: "CPU：Intel Pentium Gold", category: "cpu", rare: "C", badge: "コモン", weight: 9 },
      { name: "CPU：Intel Core i3", category: "cpu", rare: "C", badge: "コモン", weight: 9 },
      { name: "CPU：AMD Athlon（アスロン）", category: "cpu", rare: "C", badge: "コモン", weight: 9 },
      { name: "CPU：AMD Ryzen 3", category: "cpu", rare: "C", badge: "コモン", weight: 9 },

      // --- CPU（レア：王道・メインストリーム） ---
      { name: "CPU：Intel Core i5", category: "cpu", rare: "R", badge: "レア", weight: 8 },
      { name: "CPU：Intel Core i7", category: "cpu", rare: "R", badge: "レア", weight: 6 },
      { name: "CPU：Intel Core Ultra 5", category: "cpu", rare: "R", badge: "レア", weight: 6 },
      { name: "CPU：Intel Core Ultra 7", category: "cpu", rare: "R", badge: "レア", weight: 5 },
      { name: "CPU：AMD Ryzen 5", category: "cpu", rare: "R", badge: "レア", weight: 8 },
      { name: "CPU：AMD Ryzen 7", category: "cpu", rare: "R", badge: "レア", weight: 6 },

      // --- CPU（超激レア：ハイエンド＆怪物級！） ---
      { name: "CPU：Intel Core i9", category: "cpu", rare: "UR", badge: "超激レア", weight: 3 },
      { name: "CPU：Intel Core Ultra 9", category: "cpu", rare: "UR", badge: "超激レア", weight: 3 },
      { name: "CPU：AMD Ryzen 9（X3D）", category: "cpu", rare: "UR", badge: "超激レア", weight: 3 },
      { name: "CPU：Intel Xeon（サーバー用）", category: "cpu", rare: "UR", badge: "超激レア", weight: 2 },
      { name: "CPU：AMD EPYC（サーバー用）", category: "cpu", rare: "UR", badge: "超激レア", weight: 2 },
      { name: "CPU：AMD Ryzen Threadripper", category: "cpu", rare: "UR", badge: "超激レア", weight: 2 },

      // --- その他の自作PCパーツ ---
      { name: "CPUグリス（高熱伝導）", category: "other", rare: "C", badge: "コモン", weight: 10 },
      { name: "光るケースファン 120mm", category: "other", rare: "C", badge: "コモン", weight: 10 },
      { name: "ATX マザーボード", category: "mb", rare: "R", badge: "レア", weight: 12 },
      { name: "電源ユニット 850W Gold", category: "psu", rare: "R", badge: "レア", weight: 12 },
      { name: "DDR5 メモリ 32GB", category: "ram", rare: "R", badge: "レア", weight: 12 },
      { name: "NVMe M.2 SSD 1TB", category: "ssd", rare: "R", badge: "レア", weight: 12 },
      { name: "PCケース（箱ごと・強化ガラス）", category: "case", rare: "UR", badge: "超激レア", weight: 8 },
      { name: "超ハイエンド GPU (RTX)", category: "gpu", rare: "UR", badge: "超激レア", weight: 5 }
    ];

    const totalCpuTypes = partsPool.filter(p => p.category === "cpu").length;

    const requiredCategories = [
      { key: "case", label: "📦 PCケース（箱）" },
      { key: "cpu",  label: "🧠 CPU" },
      { key: "mb",   label: "🔌 マザーボード" },
      { key: "ram",  label: "📏 メモリ" },
      { key: "ssd",  label: "💾 SSD" },
      { key: "psu",  label: "⚡ 電源ユニット" }
    ];

    let inventory = JSON.parse(localStorage.getItem("pasostop_fullpc_inv") || "{}");

    const map = L.map('map').setView([35.1530, 136.9318], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const pasostopBlueIcon = L.divIcon({
      className: '',
      html: '<div class="pasostop-icon"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const stopLayerGroup = L.layerGroup().addTo(map);

    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function renderStopsOnMap() {
      stopLayerGroup.clearLayers();
      stops.forEach(s => {
        L.marker([s.lat, s.lng], { icon: pasostopBlueIcon }).addTo(stopLayerGroup).bindPopup(s.name);
        L.circle([s.lat, s.lng], {
          radius: s.radius, color: '#0284c7', fillColor: '#38bdf8', fillOpacity: 0.22, weight: 2
        }).addTo(stopLayerGroup);
      });
    }

    function hasTestKeyword(text) {
      return /test/i.test(text || "");
    }

    function findSmartMidpoint() {
      const candidates = [];
      for (let i = 0; i < stops.length; i++) {
        for (let j = i + 1; j < stops.length; j++) {
          const a = stops[i];
          const b = stops[j];
          const dist = Math.round(getDistance(a.lat, a.lng, b.lat, b.lng));
          if (dist >= 250 && dist <= 1500) {
            const midLat = Number(((a.lat + b.lat) / 2).toFixed(6));
            const midLng = Number(((a.lng + b.lng) / 2).toFixed(6));
            const tooClose = stops.some(s => getDistance(midLat, midLng, s.lat, s.lng) < 120);
            if (!tooClose) {
              candidates.push({ a, b, dist, midLat, midLng });
            }
          }
        }
      }
      if (candidates.length > 0) {
        return candidates[Math.floor(Math.random() * candidates.length)];
      }
      const fallback = stops[0] || { name: "桜山駅", lat: 35.1536, lng: 136.9316 };
      return {
        a: fallback,
        b: fallback,
        dist: 150,
        midLat: Number((fallback.lat + 0.0012).toFixed(6)),
        midLng: Number((fallback.lng + 0.0010).toFixed(6))
      };
    }

    function proposeAiStop() {
      const inputVal = document.getElementById("customCandidateName").value.trim();
      const smart = findSmartMidpoint();
      const isTest = hasTestKeyword(inputVal);

      const cleanA = smart.a.name.replace(/^パソストップ：/, "");
      const cleanB = smart.b.name.replace(/^パソストップ：/, "");

      const candidateName = inputVal
        ? (inputVal.startsWith("パソストップ：") ? inputVal : `パソストップ：${inputVal}`)
        : `パソストップ：${cleanA}〜${cleanB} 中継地点`;

      const reason = isTest
        ? "「TEST」文字列を検知したため、AI判定ルールにより必ず承認対象として提案します！"
        : `「${cleanA}」と「${cleanB}」（直線約${smart.dist}m）の中間地点付近で、ルート空白を埋めるのに適しているとAIが判定しました！`;

      pendingProposal = {
        id: "stop_" + Date.now(),
        name: candidateName,
        lat: smart.midLat,
        lng: smart.midLng,
        radius: 50,
        isTest
      };

      const area = document.getElementById("aiProposalArea");
      area.innerHTML = `
        <div class="ai-card">
          <span class="ai-badge ${isTest ? "ai-test-badge" : ""}">
            ${isTest ? "⚡ TEST検知・必ず承認" : "🤖 AIルート分析候補"}
          </span>
          <div><strong>${candidateName}</strong></div>
          <div style="font-size:12px; color:#cbd5e1; margin-top:4px;">${reason}</div>
          <div style="font-size:11px; color:#94a3b8; margin-top:4px;">座標: ${smart.midLat}, ${smart.midLng}（判定半径50m）</div>
          <div class="ai-actions">
            <button class="approve-btn" onclick="approveProposal()">✅ 承認して追加</button>
            <button class="reject-btn" onclick="rejectProposal()">❌ 見送る</button>
          </div>
        </div>
      `;

      if (isTest) {
        document.getElementById("status").textContent = "⚡ 「TEST」を検知！承認ボタンですぐ追加できるよ！";
      }
    }

    function approveProposal() {
      if (!pendingProposal) return;
      stops.push(pendingProposal);
      localStorage.setItem("pasostop_custom_stops", JSON.stringify(stops));
      renderStopsOnMap();
      map.setView([pendingProposal.lat, pendingProposal.lng], 16);
      document.getElementById("status").textContent = `✅ 承認完了！「${pendingProposal.name}」を追加したよ！`;
      pendingProposal = null;
      document.getElementById("customCandidateName").value = "";
      document.getElementById("aiProposalArea").innerHTML = "";
    }

    function rejectProposal() {
      pendingProposal = null;
      document.getElementById("aiProposalArea").innerHTML = "";
      document.getElementById("status").textContent = "今回のAI候補は見送ったよ。";
    }

    function drawPart() {
      const total = partsPool.reduce((sum, p) => sum + p.weight, 0);
      let r = Math.random() * total;
      for (const p of partsPool) {
        r -= p.weight;
        if (r <= 0) return p;
      }
      return partsPool[0];
    }

    function renderUI() {
      const ul = document.getElementById("partList");
      ul.innerHTML = "";
      const keys = Object.keys(inventory);
      let ownedCpuTypes = 0;

      if (keys.length === 0) {
        ul.innerHTML = `<li class="part-item"><span>まだパーツがないよ！青いパソストップへ行こう</span></li>`;
      } else {
        keys.forEach(name => {
          const found = partsPool.find(p => p.name === name);
          if (found && found.category === "cpu" && inventory[name] > 0) {
            ownedCpuTypes++;
          }
          const rareClass = found ? `rare-${found.rare.toLowerCase()}` : "rare-c";
          const badge = found ? found.badge : "パーツ";
          const li = document.createElement("li");
          li.className = `part-item ${rareClass}`;
          li.innerHTML = `<span>${name} <small>[${badge}]</small></span><strong>×${inventory[name]}</strong>`;
          ul.appendChild(li);
        });
      }

      document.getElementById("cpuDexCount").textContent = `CPU図鑑: ${ownedCpuTypes} / ${totalCpuTypes}`;

      const ownedCategories = new Set();
      keys.forEach(name => {
        if (inventory[name] > 0) {
          const found = partsPool.find(p => p.name === name);
          if (found) ownedCategories.add(found.category);
        }
      });

      const checklist = document.getElementById("checklist");
      checklist.innerHTML = "";
      let doneCount = 0;

      requiredCategories.forEach(req => {
        const isDone = ownedCategories.has(req.key);
        if (isDone) doneCount++;
        const div = document.createElement("div");
        div.className = "check-item" + (isDone ? " check-done" : "");
        div.textContent = (isDone ? "✅ " : "⬜ ") + req.label;
        checklist.appendChild(div);
      });

      document.getElementById("progressCount").textContent = `${doneCount} / 6`;
      document.getElementById("pcComplete").style.display = (doneCount === 6) ? "block" : "none";
    }

    let myMarker = null;

    function spinPasostop() {
      const status = document.getElementById("status");
      const accEl = document.getElementById("gpsAccuracy");
      status.textContent = "📡 GPSで青いパソストップを探知中...";

      if (!navigator.geolocation) {
        status.textContent = "❌ GPSが使えない環境みたい";
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const myLat = pos.coords.latitude;
        const myLng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy || 0);
        accEl.textContent = `GPS精度：誤差 約${acc}m（緯度 ${myLat.toFixed(5)}, 経度 ${myLng.toFixed(5)}）`;

        map.setView([myLat, myLng], 16);
        if (myMarker) map.removeLayer(myMarker);
        myMarker = L.circleMarker([myLat, myLng], {
          color: '#facc15', fillColor: '#fde047', fillOpacity: 0.95, radius: 9
        }).addTo(map).bindPopup("現在地");

        let hitStop = null;
        let minDist = Infinity;
        let nearestName = "";

        stops.forEach(s => {
          const dist = Math.round(getDistance(myLat, myLng, s.lat, s.lng));
          if (dist < minDist) {
            minDist = dist;
            nearestName = s.name;
          }
          if (dist <= s.radius && !hitStop) {
            hitStop = s;
          }
        });

        if (hitStop) {
          const got = drawPart();
          inventory[got.name] = (inventory[got.name] || 0) + 1;
          localStorage.setItem("pasostop_fullpc_inv", JSON.stringify(inventory));
          renderUI();
          status.textContent = `🎉 「${got.name}」(${got.badge}) をゲット！`;
          alert(`⚡ ${hitStop.name} で\n「${got.name}」を手に入れた！`);
        } else {
          status.textContent = `一番近いパソストップまであと約 ${minDist}m（${nearestName}）`;
        }
      }, () => {
        status.textContent = "⚠️ 位置情報が取れなかったよ。許可設定を確認してね！";
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }

    renderStopsOnMap();
    renderUI();
    setTimeout(() => map.invalidateSize(), 300);
  </script>
</body>
</html>
