<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パソストップ GO（APIキー不要・安心版）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0; padding: 14px; background: #0b1120; color: #f8fafc; text-align: center;
    }
    h1 { font-size: 20px; color: #38bdf8; margin: 0 0 10px 0; letter-spacing: 0.03em; }

    #map {
      display: block; width: 100%; height: 270px; min-height: 270px;
      background: #1e293b; border-radius: 14px; margin-bottom: 12px;
      border: 2px solid #38bdf8; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    .main-btn {
      background: linear-gradient(90deg, #0284c7, #2563eb); color: white; border: none;
      padding: 15px 22px; font-size: 16px; font-weight: bold; border-radius: 999px;
      cursor: pointer; width: 100%; max-width: 360px; box-shadow: 0 4px 16px rgba(37,99,235,0.45);
    }
    .main-btn:active { transform: scale(0.98); }

    .sub-btn {
      background: #334155; color: #f1f5f9; border: 1px solid #64748b;
      padding: 8px 13px; font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .approve-btn {
      background: #16a34a; color: white; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1;
    }
    .reject-btn {
      background: #475569; color: #f8fafc; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }

    #status { margin: 10px 0 4px; font-weight: bold; color: #fde047; min-height: 22px; font-size: 14px; }
    #gpsAccuracy { font-size: 12px; color: #94a3b8; margin-bottom: 12px; min-height: 16px; }

    .box {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 13px; max-width: 440px; margin: 0 auto 12px; text-align: left;
    }
    .box-title {
      font-size: 15px; font-weight: bold; color: #7dd3fc; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .stop-mini-list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
    .stop-mini-item {
      background: #0f172a; padding: 8px 11px; border-radius: 8px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #38bdf8;
    }

    .ai-card {
      background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px;
      padding: 11px; margin-top: 8px; font-size: 13px; line-height: 1.5;
    }
    .ai-badge {
      display: inline-block; background: #0284c7; color: #fff; font-size: 11px;
      padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; font-weight: bold;
    }
    .ai-test-badge { background: #e11d48; }
    .ai-actions { display: flex; gap: 8px; margin-top: 10px; }
    .ai-input {
      width: 100%; padding: 9px 11px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 13px; margin-top: 6px;
    }

    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; font-size: 13px; }
    .check-item { background: #0f172a; padding: 7px 10px; border-radius: 8px; color: #64748b; }
    .check-done { color: #4ade80; font-weight: bold; border: 1px solid #22c55e; }
    .pc-complete {
      margin-top: 8px; padding: 9px; background: linear-gradient(90deg, #16a34a, #059669);
      color: white; font-weight: bold; text-align: center; border-radius: 8px; display: none;
    }

    .part-list { list-style: none; padding: 0; margin: 0; }
    .part-item {
      background: #0f172a; padding: 9px 12px; margin-bottom: 6px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    }
    .rare-ur { border-left: 4px solid #f43f5e; }
    .rare-r  { border-left: 4px solid #facc15; }
    .rare-c  { border-left: 4px solid #38bdf8; }

    .pasostop-icon {
      width: 26px; height: 26px;
      background: radial-gradient(circle, #e0f2fe 20%, #0ea5e9 65%, #1d4ed8 100%);
      border: 3px solid #ffffff; border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8, 0 0 22px #0284c7;
    }
  </style>
</head>
<body>

  <h1>🖥️ パソストップ GO</h1>
  <div id="map"></div>

  <button class="main-btn" onclick="spinPasostop()">⚡ パソストップを回す（現在地チェック）</button
