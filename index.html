<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パソストップ GO（地図表示修正版）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #0f172a; color: #f8fafc; text-align: center; }
    h1 { font-size: 20px; color: #38bdf8; margin: 0 0 10px 0; }
    #map {
      display: block;
      width: 100%;
      height: 300px;
      min-height: 300px;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 2px solid #38bdf8;
      z-index: 1;
    }
    #mapDebug {
      font-size: 12px;
      color: #93c5fd;
      margin-bottom: 10px;
    }
    .main-btn {
      background: linear-gradient(90deg, #0284c7, #2563eb); color: white; border: none;
      padding: 15px 24px; font-size: 17px; font-weight: bold; border-radius: 999px;
      cursor: pointer; width: 100%; max-width: 340px;
    }
    .pasostop-icon {
      width: 26px; height: 26px;
      background: radial-gradient(circle, #e0f2fe 20%, #0ea5e9 65%, #1d4ed8 100%);
      border: 3px solid #ffffff; border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8, 0 0 22px #0284c7;
    }
  </style>
</head>
<body>

  <h1>🖥️ パソストップ GO（地図テスト）</h1>
  <div id="mapDebug">地図を読み込み中...</div>
  <div id="map"></div>

  <button class="main-btn" onclick="alert('ボタンは動いてるよ！')">⚡ 動作テストボタン</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const debugEl = document.getElementById("mapDebug");

    window.addEventListener("load", function() {
      if (typeof L === "undefined") {
        debugEl.textContent = "❌ エラー：地図プログラム(Leaflet)が読み込めていません（ネット接続か開き方を確認してね）";
        debugEl.style.color = "#f43f5e";
        return;
      }

      try {
        const map = L.map('map').setView([35.1536, 136.9316], 15);

        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        });

        tileLayer.on('load', function() {
          debugEl.textContent = "✅ 地図の表示に成功したよ！";
          debugEl.style.color = "#4ade80";
        });

        tileLayer.on('tileerror', function() {
          debugEl.textContent = "⚠️ 地図画像の読み込みエラー（ネット接続または制限を確認してね）";
          debugEl.style.color = "#facc15";
        });

        tileLayer.addTo(map);

        const pasostopBlueIcon = L.divIcon({
          className: '',
          html: '<div class="pasostop-icon"></div>',
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        L.marker([35.1536, 136.9316], { icon: pasostopBlueIcon })
          .addTo(map)
          .bindPopup("パソストップ：桜山駅");

        // サイズ再計算（枠だけ出てグレーになる現象を防ぐ）
        setTimeout(function() {
          map.invalidateSize();
        }, 300);

      } catch (e) {
        debugEl.textContent = "❌ 地図作成エラー: " + e.message;
        debugEl.style.color = "#f43f5e";
      }
    });
  </script>
</body>
</html>
