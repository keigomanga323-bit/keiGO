<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パソストップ GO（AI承認・国土地理院地図版）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #0f172a; color: #f8fafc; text-align: center; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 10px; }
    #map {
      display: block; width: 100%; height: 260px; min-height: 260px;
      background: #1e293b; border-radius: 12px; margin-bottom: 14px; border: 2px solid #38bdf8;
    }
    .main-btn {
      background: linear-gradient(90deg, #0284c7, #2563eb); color: white; border: none;
      padding: 15px 24px; font-size: 17px; font-weight: bold; border-radius: 999px;
      cursor: pointer; width: 100%; max-width: 340px; box-shadow: 0 4px 14px rgba(37,99,235,0.5);
    }
    .main-btn:active { transform: scale(0.98); }
    .sub-btn {
      background: #334155; color: #e2e8f0; border: 1px solid #475569;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .approve-btn {
      background: #16a34a; color: white; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .reject-btn {
      background: #475569; color: #f8fafc; border: none;
      padding: 9px 14px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    #status { margin: 12px 0; font-weight: bold; color: #fde047; min-height: 24px; font-size: 14px; }
    .box { background: #1e293b; border-radius: 12px; padding: 12px; max-width: 420px; margin: 0 auto 12px; text-align: left; }
    .box-title { font-size: 15px; font-weight: bold; color: #93c5fd; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .ai-card { background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px; padding: 10px; margin-top: 8px; font-size: 13px; }
    .ai-badge { display: inline-block; background: #0284c7; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 999px; margin-bottom: 5px; font-weight: bold; }
    .ai-test-badge { background: #e11d48; }
    .ai-actions { display: flex; gap: 8px; margin-top: 8px; }
    .ai-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 13px; margin-top: 6px; }
    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
    .check-item { background: #0f172a; padding: 6px 10px; border-radius: 6px; color: #64748b; }
    .check-done { color: #4ade80; font-weight: bold; border: 1px solid #22c55e; }
    .pc-complete { margin-top: 8px; padding: 8px; background: linear-gradient(90deg, #16a34a, #059669); color: white; font-weight: bold; text-align: center; border-radius: 8px; display: none; }
    .part-list { list-style: none; padding: 0; margin: 0; }
    .part-item { background: #0f172a; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .rare-ur { border-left: 4px solid #f43f5e; }
    .rare-r  { border-left: 4px solid #facc15; }
    .rare-c  { border-left: 4px solid #38bdf8; }
    .pasostop-icon {
      width: 26px; height: 26px;
      background: radial-gradient(circle, #e0f2fe 20%, #0ea5e9 65%, #1d4ed8 100%);
      border: 3px solid #ffffff; border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8, 0 0 22px #0284c7;
    }
  </style>
</head>
<body>

  <h1>🖥️ パソストップ GO（桜山・AI承認）</h1>
  <div id="map"></div>

  <button class="main-btn" onclick="spinPasostop()">⚡ パソストップを回す（現在地チェック）</button>
  <div id="status">青いパソストップに近づいてパーツを集めよう！</div>

  <div class="box">
    <div class="box-title">
      <span>🤖 AIパソストップ提案・承認</span>
      <button class="sub-btn" onclick="proposeAiStop()">候補を探す</button>
    </div>
    <div style="font-size:12px; color:#94a3b8;">
      スポット名を入力して提案させられるよ（「TEST」を含むと必ず承認！）
    </div>
    <input type="text" id="customCandidateName" class="ai-input" placeholder="例：TEST_桜山交差点 / 昭和区お散歩ポイント">
    <div id="aiProposalArea"></div>
  </div>

  <div class="box">
    <div class="box-title">
      <span>🛠️ 自作PC 必須6パーツ進捗</span>
      <span id="progressCount">0 / 6</span>
    </div>
    <div class="checklist" id="checklist"></div>
    <div class="pc-complete" id="pcComplete">🎉 必須パーツ全制覇！自作PC起動成功！！</div>
  </div>

  <div class="box">
    <div class="box-title"><span>📦 ゲットしたPCパーツ箱</span></div>
    <ul class="part-list" id="partList"></ul>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const defaultStops = [
      { id: "proud_sakurayama", name: "パソストップ：プラウド昭和桜山", lat: 35.1548, lng: 136.9304, radius: 45 },
      { id: "sakurayama_st", name: "パソストップ：桜山駅", lat: 35.1536, lng: 136.9316, radius: 50 },
      { id: "ncu_hospital", name: "パソストップ：名古屋市立大学病院", lat: 35.1514, lng: 136.9333, radius: 80 },
      { id: "showa_ward", name: "パソストップ：名古屋市昭和区役所周辺", lat: 35.1585, lng: 136.9295, radius: 55 },
      { id: "arahata_st", name: "パソストップ：荒畑駅", lat: 35.1533, lng: 136.9225, radius: 50 },
      { id: "gokiso_st", name: "パソストップ：御器所駅", lat: 35.1511, lng: 136.9154, radius: 50 }
    ];

    let stops = JSON.parse(localStorage.getItem("pasostop_custom_stops") || "null") || defaultStops;
    let pendingProposal = null;

    const partsPool = [
      { name: "CPUグリス（高熱伝導）", category: "other", rare: "C", badge: "コモン", weight: 18 },
      { name: "光るケースファン 120mm", category: "other", rare: "C", badge: "コモン", weight: 16 },
      { name: "CR2032 ボタン電池", category: "other", rare: "C", badge: "コモン", weight: 14 },
      { name: "CPU（Core i7 / Ryzen 7）", category: "cpu", rare: "R", badge: "レア", weight: 10 },
      { name: "ATX マザーボード", category: "mb", rare: "R", badge: "レア", weight: 10 },
      { name: "電源ユニット 850W Gold", category: "psu", rare: "R", badge: "レア", weight: 10 },
      { name: "DDR5 メモリ 32GB", category: "ram", rare: "R", badge: "レア", weight: 9 },
      { name: "NVMe M.2 SSD 1TB", category: "ssd", rare: "R", badge: "レア", weight: 9 },
      { name: "PCケース（箱ごと・強化ガラス）", category: "case", rare: "UR", badge: "超激レア", weight: 6 },
      { name: "最強CPU（Core i9 / Ryzen 9）", category: "cpu", rare: "UR", badge: "超激レア", weight: 4 },
      { name: "超ハイエンド GPU (RTX)", category: "gpu", rare: "UR", badge: "超激レア", weight: 4 }
    ];

    const requiredCategories = [
      { key: "case", label: "📦 PCケース（箱）" },
      { key: "cpu",  label: "🧠 CPU" },
      { key: "mb",   label: "🔌 マザーボード" },
      { key: "ram",  label: "📏 メモリ" },
      { key: "ssd",  label: "💾 SSD" },
      { key: "psu",  label: "⚡ 電源ユニット" }
    ];

    let inventory = JSON.parse(localStorage.getItem("pasostop_fullpc_inv") || "{}");

    // 国土地理院の標準地図を使用（ローカルファイルでもブロックされにくい！）
    const map = L.map('map').setView([35.1530, 136.9318], 15);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
    }).addTo(map);

    const pasostopBlueIcon = L.divIcon({
      className: '',
      html: '<div class="pasostop-icon"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const stopLayerGroup = L.layerGroup().addTo(map);

    function renderStopsOnMap() {
      stopLayerGroup.clearLayers();
      stops.forEach(s => {
        L.marker([s.lat, s.lng], { icon: pasostopBlueIcon }).addTo(stopLayerGroup).bindPopup(s.name);
        L.circle([s.lat, s.lng], {
          radius: s.radius, color: '#0284c7', fillColor: '#38bdf8', fillOpacity: 0.25, weight: 2
        }).addTo(stopLayerGroup);
      });
    }

    function hasTestKeyword(text) {
      return /test/i.test(text || "");
    }

    function proposeAiStop() {
      const inputVal = document.getElementById("customCandidateName").value.trim();
      const base = stops[Math.floor(Math.random() * stops.length)] || { lat: 35.1536, lng: 136.9316 };
      const offsetLat = (Math.random() - 0.5) * 0.004;
      const offsetLng = (Math.random() - 0.5) * 0.005;
      const lat = Number((base.lat + offsetLat).toFixed(6));
      const lng = Number((base.lng + offsetLng).toFixed(6));

      const isTest = hasTestKeyword(inputVal);
      const candidateName = inputVal
        ? (inputVal.startsWith("パソストップ：") ? inputVal : `パソストップ：${inputVal}`)
        : `パソストップ：AIスカウト地点 #${stops.length + 1}`;

      const reason = isTest
        ? "「TEST」文字列を検知したため、AI判定ルールにより必ず承認対象として提案します！"
        : "既存スポット間の移動ルート上にあり、パーツ回収のテンポが良くなりそうだとAIが判定しました！";

      pendingProposal = { id: "stop_" + Date.now(), name: candidateName, lat, lng, radius: 50, isTest };

      const area = document.getElementById("aiProposalArea");
      area.innerHTML = `
        <div class="ai-card">
          <span class="ai-badge ${isTest ? "ai-test-badge" : ""}">
            ${isTest ? "⚡ TEST検知・必ず承認" : "🤖 AIおすすめ候補"}
          </span>
          <div><strong>${candidateName}</strong></div>
          <div style="font-size:12px; color:#cbd5e1; margin-top:4px;">${reason}</div>
          <div style="font-size:11px; color:#94a3b8; margin-top:4px;">座標: ${lat}, ${lng}（半径50m）</div>
          <div class="ai-actions">
            <button class="approve-btn" onclick="approveProposal()">✅ 承認して追加</button>
            <button class="reject-btn" onclick="rejectProposal()">❌ 見送る</button>
          </div>
        </div>
      `;
    }

    function approveProposal() {
      if (!pendingProposal) return;
      stops.push(pendingProposal);
      localStorage.setItem("pasostop_custom_stops", JSON.stringify(stops));
      renderStopsOnMap();
      map.setView([pendingProposal.lat, pendingProposal.lng], 16);
      document.getElementById("status").textContent = `✅ 承認完了！「${pendingProposal.name}」を追加したよ！`;
      pendingProposal = null;
      document.getElementById("customCandidateName").value = "";
      document.getElementById("aiProposalArea").innerHTML = "";
    }

    function rejectProposal() {
      pendingProposal = null;
      document.getElementById("aiProposalArea").innerHTML = "";
      document.getElementById("status").textContent = "今回のAI候補は見送ったよ。";
    }

    function drawPart() {
      const total = partsPool.reduce((sum, p) => sum + p.weight, 0);
      let r = Math.random() * total;
      for (const p of partsPool) {
        r -= p.weight;
        if (r <= 0) return p;
      }
      return partsPool[0];
    }

    function renderUI() {
      const ul = document.getElementById("partList");
      ul.innerHTML = "";
      const keys = Object.keys(inventory);
      if (keys.length === 0) {
        ul.innerHTML = `<li class="part-item"><span>まだパーツがないよ！青いパソストップへ行こう</span></li>`;
      } else {
        keys.forEach(name => {
          const found = partsPool.find(p => p.name === name);
          const rareClass = found ? `rare-${found.rare.toLowerCase()}` : "rare-c";
          const badge = found ? found.badge : "パーツ";
          const li = document.createElement("li");
          li.className = `part-item ${rareClass}`;
          li.innerHTML = `<span>${name} <small>[${badge}]</small></span><strong>×${inventory[name]}</strong>`;
          ul.appendChild(li);
        });
      }

      const ownedCategories = new Set();
      keys.forEach(name => {
        if (inventory[name] > 0) {
          const found = partsPool.find(p => p.name === name);
          if (found) ownedCategories.add(found.category);
        }
      });

      const checklist = document.getElementById("checklist");
      checklist.innerHTML = "";
      let doneCount = 0;

      requiredCategories.forEach(req => {
        const isDone = ownedCategories.has(req.key);
        if (isDone) doneCount++;
        const div = document.createElement("div");
        div.className = "check-item" + (isDone ? " check-done" : "");
        div.textContent = (isDone ? "✅ " : "⬜ ") + req.label;
        checklist.appendChild(div);
      });

      document.getElementById("progressCount").textContent = `${doneCount} / 6`;
      document.getElementById("pcComplete").style.display = (doneCount === 6) ? "block" : "none";
    }

    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function spinPasostop() {
      const status = document.getElementById("status");
      status.textContent = "📡 GPSで青いパソストップを探知中...";

      if (!navigator.geolocation) {
        status.textContent = "❌ GPSが使えない環境みたい";
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const myLat = pos.coords.latitude;
        const myLng = pos.coords.longitude;
        map.setView([myLat, myLng], 17);
        L.circleMarker([myLat, myLng], { color: '#facc15', fillColor: '#fde047', fillOpacity: 0.9, radius: 8 }).addTo(map);

        let hitStop = null;
        let minDist = Infinity;
        let nearestName = "";

        stops.forEach(s => {
          const dist = Math.round(getDistance(myLat, myLng, s.lat, s.lng));
          if (dist < minDist) {
            minDist = dist;
            nearestName = s.name;
          }
          if (dist <= s.radius && !hitStop) {
            hitStop = s;
          }
        });

        if (hitStop) {
          const got = drawPart();
          inventory[got.name] = (inventory[got.name] || 0) + 1;
          localStorage.setItem("pasostop_fullpc_inv", JSON.stringify(inventory));
          renderUI();
          status.textContent = `🎉 「${got.name}」(${got.badge}) をゲット！`;
          alert(`⚡ ${hitStop.name} で\n「${got.name}」を手に入れた！`);
        } else {
          status.textContent = `一番近いパソストップまであと約 ${minDist}m（${nearestName}）`;
        }
      }, () => {
        status.textContent = "⚠️ 位置情報が取れなかったよ。許可設定を確認してね！";
      }, { enableHighAccuracy: true });
    }

    renderStopsOnMap();
    renderUI();
    setTimeout(() => map.invalidateSize(), 300);
  </script>
</body>
</html>
